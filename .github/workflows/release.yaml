name: "Release"

permissions:
    contents: write
    actions: read
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Specify tag to create"
                required: true

jobs:
    create-tag:
        name: Create Tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Verify Cargo.toml version matches tag
              env:
                  TAG: ${{ github.event.inputs.tag }}
              run: |
                  if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
                      VERSION_SOURCE="refs/tags/$TAG"
                  else
                      VERSION_SOURCE="HEAD"
                  fi
                  VERSION=$(git show "$VERSION_SOURCE:Cargo.toml" | grep '^version = ' | head -1 | cut -d'"' -f2)
                  if [ -z "$VERSION" ]; then
                      echo "Could not read a version from Cargo.toml at $VERSION_SOURCE." >&2
                      exit 1
                  fi
                  if [ "$TAG" != "$VERSION" ] && [ "$TAG" != "v$VERSION" ]; then
                      echo "Tag $TAG does not match Cargo.toml version $VERSION at $VERSION_SOURCE." >&2
                      echo "Bump the version under [workspace.package] in Cargo.toml to match the release tag first." >&2
                      exit 1
                  fi
                  echo "Cargo.toml version $VERSION matches tag $TAG."

            - name: Create tag
              env:
                  TAG: ${{ github.event.inputs.tag }}
              run: |
                  if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists, using it as-is."
                    echo "The build will check out $TAG ($(git rev-list -n1 "$TAG")) and update its release."
                    exit 0
                  fi
                  git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com tag -a "$TAG" -m "Release $TAG" HEAD
                  git push origin "refs/tags/$TAG"

    build:
        name: Build
        needs: create-tag
        strategy:
            matrix:
                target:
                    - target: macos-arm
                      os: macos-latest
                      make: bash scripts/build-macos.sh aarch64
                      artifact_path: |
                          echo "ARTIFACT_PATH=target/packaging/aquanter-surface-aarch64-macos.tar.gz" >> "$GITHUB_ENV"
                    - target: macos-x64
                      os: macos-15-intel
                      make: bash scripts/build-macos.sh x86_64
                      artifact_path: |
                          echo "ARTIFACT_PATH=target/packaging/aquanter-surface-x86_64-macos.tar.gz" >> "$GITHUB_ENV"
                    - target: windows-x64
                      os: windows-latest
                      make: bash scripts/build-windows.sh x86_64
                    - target: linux-x64
                      os: ubuntu-24.04
                      make: bash scripts/package-linux.sh package x86_64
                      artifact_path: |
                          echo "ARTIFACT_PATH=$(bash scripts/package-linux.sh archive_path x86_64)" >> "$GITHUB_ENV"
                    - target: linux-arm
                      os: ubuntu-24.04-arm
                      make: bash scripts/package-linux.sh package aarch64
                      artifact_path: |
                          echo "ARTIFACT_PATH=$(bash scripts/package-linux.sh archive_path aarch64)" >> "$GITHUB_ENV"
        runs-on: ${{ matrix.target.os }}
        env:
            FLOWSURFACE_OFFICIAL_RELEASE: "true"
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: refs/tags/${{ github.event.inputs.tag }}

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              shell: bash
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  if [ -z "$channel" ]; then
                      echo "Failed to read toolchain channel from rust-toolchain.toml" >&2
                      exit 1
                  fi
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}

            - name: Install linux deps
              if: startsWith(matrix.target.target, 'linux')
              run: |
                  sudo apt update
                  sudo apt install -y \
                    build-essential \
                    git \
                    pkg-config \
                    libudev-dev \
                    libxkbcommon-dev \
                    libasound2-dev

            - name: Use thin LTO for Intel macOS
              if: matrix.target.target == 'macos-x64'
              shell: bash
              run: echo 'CARGO_PROFILE_PACKAGING_LTO=thin' >> "$GITHUB_ENV"

            - name: Build
              run: ${{ matrix.target.make }}

            - name: Set artifact path
              if: matrix.target.target != 'windows-x64'
              run: ${{ matrix.target.artifact_path }}

            - name: Zip Windows executable
              if: matrix.target.target == 'windows-x64'
              shell: pwsh
              run: |
                  # ponytail: unsigned exe in a zip; add SignPath/MSIX back once signing secrets exist
                  Compress-Archive -Path target/packaging/win-unsigned/aquanter-surface.exe -DestinationPath target/packaging/aquanter-surface-x86_64-windows.zip
                  "ARTIFACT_PATH=target/packaging/aquanter-surface-x86_64-windows.zip" >> $env:GITHUB_ENV

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              env:
                  ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
              with:
                  path: ${{ env.ARTIFACT_PATH }}
                  archive: false
                  if-no-files-found: error

    publish-release:
        name: Publish Release
        needs: [build, create-universal]
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Download Windows package
              uses: actions/download-artifact@v8
              with:
                  name: aquanter-surface-x86_64-windows.zip
                  path: release-artifacts
                  skip-decompress: true

            - name: Download macOS installer
              uses: actions/download-artifact@v8
              with:
                  name: aquanter-surface-universal-macos.dmg
                  path: release-artifacts
                  skip-decompress: true

            - name: Download Linux x64 package
              uses: actions/download-artifact@v8
              with:
                  name: aquanter-surface-x86_64-linux.tar.gz
                  path: release-artifacts
                  skip-decompress: true

            - name: Download Linux arm package
              uses: actions/download-artifact@v8
              with:
                  name: aquanter-surface-aarch64-linux.tar.gz
                  path: release-artifacts
                  skip-decompress: true

            - name: Generate checksums
              working-directory: release-artifacts
              run: |
                  sha256sum aquanter-surface-universal-macos.dmg | awk '{print $1 "  aquanter-surface-universal-macos.dmg"}' >> SHA256SUMS
                  sha256sum aquanter-surface-x86_64-windows.zip | awk '{print $1 "  aquanter-surface-x86_64-windows.zip"}' >> SHA256SUMS
                  sha256sum aquanter-surface-x86_64-linux.tar.gz | awk '{print $1 "  aquanter-surface-x86_64-linux.tar.gz"}' >> SHA256SUMS
                  sha256sum aquanter-surface-aarch64-linux.tar.gz | awk '{print $1 "  aquanter-surface-aarch64-linux.tar.gz"}' >> SHA256SUMS

                  cat SHA256SUMS

            - name: Create or update release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  draft: false
                  overwrite_files: true
                  fail_on_unmatched_files: true
                  files: release-artifacts/*

    create-universal:
        name: Package Universal macOS App
        needs: build
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: refs/tags/${{ github.event.inputs.tag }}

            - name: Download arm artifact
              uses: actions/download-artifact@v8
              with:
                  name: aquanter-surface-aarch64-macos.tar.gz
                  path: macos-arm
                  skip-decompress: true

            - name: Download x64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: aquanter-surface-x86_64-macos.tar.gz
                  path: macos-x64
                  skip-decompress: true

            - name: Extract macOS arm artifact
              run: |
                  mkdir -p macos-arm/extracted
                  tar -xzf macos-arm/aquanter-surface-aarch64-macos.tar.gz -C macos-arm/extracted

            - name: Extract macOS x64 artifact
              run: |
                  mkdir -p macos-x64/extracted
                  tar -xzf macos-x64/aquanter-surface-x86_64-macos.tar.gz -C macos-x64/extracted

            - name: Create universal binary
              run: |
                  mkdir -p target/packaging
                  lipo macos-arm/extracted/aquanter-surface macos-x64/extracted/aquanter-surface -create -output target/packaging/aquanter-surface
                  lipo target/packaging/aquanter-surface -verify_arch arm64 x86_64
                  bash scripts/package-macos.sh

            - name: Upload universal artifact
              uses: actions/upload-artifact@v7
              with:
                  path: target/packaging/aquanter-surface-universal-macos.dmg
                  archive: false
                  if-no-files-found: error
